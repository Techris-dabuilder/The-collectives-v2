name: Build Web App to APK

on:
  push:
    branches: [ main ]

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          # Remove the cache line since we don't have a lock file
          # cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build the web app
        run: npm run build

      - name: Convert build files to APK
        uses: darkshredder/web-to-app-action@main
        with:
          build-folder-path: "dist"
          app-name: "MyFirstApp"
          output-folder-path: "my-apks"

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MyFirstApp-APK
          path: my-apks/
