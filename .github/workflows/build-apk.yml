name: Build Android APK

on:
  push:
    branches: [ main ]

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      # Clean up to avoid native binding issues
      - name: Clean install
        run: |
          rm -rf node_modules package-lock.json
          npm install --include=optional

      # Build with WASM fallback for Tailwind
      - name: Build web app
        env:
          TAILWIND_USE_WASM: 1
        run: |
          npm run build
          if [ ! -d "dist" ]; then
            echo "❌ Build folder 'dist' not found!"
            exit 1
          fi
          echo "✅ Build succeeded"

      # Install Capacitor
      - name: Install Capacitor
        run: npm install -g @capacitor/cli @capacitor/core @capacitor/android

      - name: Initialize Capacitor
        run: npx cap init "MyFirstApp" "com.myfirstapp.app" --web-dir=dist

      - name: Add Android
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MyFirstApp-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
